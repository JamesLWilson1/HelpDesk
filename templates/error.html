{% extends "base.html" %}
{% block title %}{{ code }} - HelpDesk{% endblock %}
{% block content %}
<section class="card error-card">
  <div class="error-code">{{ code }}</div>
  <h2>{{ title }}</h2>
  <p>{{ message }}</p>
  {% if detail %}
    <p class="error-detail">{{ detail }}</p>
  {% endif %}
  <div class="error-actions">
    {% if g.user %}
      <a class="button-link" href="{{ url_for('dashboard') }}">Back to dashboard</a>
    {% else %}
      <a class="button-link" href="{{ url_for('login') }}">Back to login</a>
    {% endif %}
  </div>
</section>
{% endblock %}
